# railway.cron.toml
# Config-as-code for the "job-sync-cron" Railway service.
#
# The main idc-web service must stay running as a persistent web server, so it can't
# also be a cron service (Railway cron services run their start command on a schedule
# and then exit). Instead, create a SECOND Railway service in the same project that
# points at this same GitHub repo, and set its Settings → Config-as-code
# "Config File Path" to `railway.cron.toml`. It builds the same way as the main app
# (Nixpacks), which gives it curl, then just curls the deployed /api/jobs/sync route
# on schedule.
#
# Environment variables to set in Railway (Project → Variables — see note below on
# which service needs which):
#   - JOOBLE_API_KEY   → set on the main idc-web service. Used by src/lib/jobs/jooble.ts
#                        to call the Jooble API. Register for a key at
#                        https://jooble.org/api/about
#   - CRON_SECRET      → set on BOTH the idc-web service and this cron service. A
#                        shared secret; the cron service sends it as a Bearer token,
#                        and src/app/api/jobs/sync/route.ts checks it before running.
#                        Generate one with: openssl rand -base64 32
#   - SYNC_URL         → set on this cron service only. The full URL of the deployed
#                        sync endpoint, e.g. https://www.instructionaldesigncentral.com/api/jobs/sync
#
# Manual trigger during development (bypasses this cron service entirely — hits your
# local dev server directly):
#   curl -X POST http://localhost:3000/api/jobs/sync \
#     -H "Authorization: Bearer YOUR_CRON_SECRET"

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "curl -sf -X POST \"$SYNC_URL\" -H \"Authorization: Bearer $CRON_SECRET\""
cronSchedule = "0 3 * * *"
restartPolicyType = "NEVER"
